<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="A straightforward calculator for quick addition, subtraction, multiplication, and division.">
    <meta name="theme-color" content="#f5f4ef">
    <title>Simple Calculator — Quick arithmetic</title>
    <style>
      :root {
        color-scheme: light;
        --paper: #f5f4ef;
        --card: #fffefa;
        --ink: #252e2b;
        --muted: #727d77;
        --line: #dfe4dc;
        --accent: #356c5b;
        --accent-dark: #285644;
        --accent-soft: #e7f0e9;
        --error: #a4423b;
        --shadow: 0 22px 60px rgba(38, 54, 46, .08), 0 2px 8px rgba(38, 54, 46, .04);
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 32px 20px;
        background:
          radial-gradient(ellipse at 50% 0%, rgba(216, 229, 216, .58), transparent 52%),
          var(--paper);
        color: var(--ink);
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .calculator {
        width: min(100%, 480px);
        padding: clamp(26px, 6vw, 42px);
        border: 1px solid rgba(217, 224, 215, .9);
        border-radius: 22px;
        background: var(--card);
        box-shadow: var(--shadow);
      }
      .eyebrow {
        margin: 0 0 10px;
        color: var(--accent);
        font-size: .72rem;
        font-weight: 700;
        letter-spacing: .14em;
        text-transform: uppercase;
      }
      h1 {
        margin: 0;
        font-size: clamp(1.8rem, 7vw, 2.35rem);
        line-height: 1.12;
        letter-spacing: -.045em;
      }
      .intro {
        margin: 12px 0 30px;
        color: var(--muted);
        font-size: .98rem;
        line-height: 1.55;
      }
      .fields {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
      }
      .field label {
        display: block;
        margin: 0 0 8px;
        color: #4d5a53;
        font-size: .82rem;
        font-weight: 650;
      }
      input {
        width: 100%;
        min-height: 52px;
        padding: 0 14px;
        border: 1px solid var(--line);
        border-radius: 10px;
        outline: none;
        background: #fff;
        color: var(--ink);
        font: inherit;
        font-size: 1rem;
        font-variant-numeric: tabular-nums;
        transition: border-color .16s ease, box-shadow .16s ease;
      }
      input::placeholder { color: #a8b0aa; }
      input:focus-visible {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(53, 108, 91, .15);
      }
      .operations {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 10px;
        margin-top: 22px;
      }
      button {
        min-height: 50px;
        border: 1px solid #d3e1d6;
        border-radius: 10px;
        background: var(--accent-soft);
        color: var(--accent-dark);
        cursor: pointer;
        font: inherit;
        font-size: 1.15rem;
        font-weight: 700;
        transition: transform .15s ease, background-color .15s ease, border-color .15s ease;
      }
      button:hover { border-color: #b8d0bf; background: #dcebe0; }
      button:active { transform: translateY(1px); }
      button:focus-visible {
        outline: 3px solid rgba(53, 108, 91, .3);
        outline-offset: 2px;
      }
      .result {
        min-height: 94px;
        margin-top: 24px;
        padding: 17px 19px;
        border-radius: 12px;
        background: #f3f5f0;
      }
      .result-label {
        display: block;
        margin-bottom: 8px;
        color: var(--muted);
        font-size: .75rem;
        font-weight: 700;
        letter-spacing: .1em;
        text-transform: uppercase;
      }
      #output {
        display: block;
        color: var(--ink);
        font-size: clamp(1.25rem, 5vw, 1.7rem);
        font-weight: 650;
        line-height: 1.25;
        overflow-wrap: anywhere;
        font-variant-numeric: tabular-nums;
      }
      #output.error { color: var(--error); font-size: .95rem; font-weight: 600; }
      @media (max-width: 380px) {
        .fields { grid-template-columns: 1fr; gap: 12px; }
        .operations { gap: 7px; }
      }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
      }
    </style>
  </head>
  <body>
    <main class="calculator" aria-labelledby="page-title">
      <p class="eyebrow">Quick arithmetic</p>
      <h1 id="page-title">Simple Calculator</h1>
      <p class="intro">Enter two numbers, then choose an operation.</p>

      <form id="calculator-form" novalidate>
        <div class="fields">
          <div class="field">
            <label for="first-number">First number</label>
            <input id="first-number" name="firstNumber" type="number" step="any" inputmode="decimal" placeholder="e.g. 12" autocomplete="off">
          </div>
          <div class="field">
            <label for="second-number">Second number</label>
            <input id="second-number" name="secondNumber" type="number" step="any" inputmode="decimal" placeholder="e.g. 4" autocomplete="off">
          </div>
        </div>
        <div class="operations" role="group" aria-label="Choose an arithmetic operation">
          <button type="submit" name="operation" value="add" aria-label="Add">+</button>
          <button type="submit" name="operation" value="subtract" aria-label="Subtract">−</button>
          <button type="submit" name="operation" value="multiply" aria-label="Multiply">×</button>
          <button type="submit" name="operation" value="divide" aria-label="Divide">÷</button>
        </div>
      </form>

      <section class="result" aria-label="Calculation result">
        <span class="result-label">Result</span>
        <output id="output" aria-live="polite" aria-atomic="true">Your answer will appear here</output>
      </section>
    </main>
    <script>
      const form = document.getElementById("calculator-form");
      const output = document.getElementById("output");

      form.addEventListener("submit", (event) => {
        event.preventDefault();
        const operation = event.submitter ? event.submitter.value : "add";
        const firstText = form.elements.firstNumber.value.trim();
        const secondText = form.elements.secondNumber.value.trim();

        output.classList.remove("error");
        if (firstText === "" || secondText === "") {
          output.textContent = "Enter both numbers to calculate.";
          output.classList.add("error");
          return;
        }

        const first = Number(firstText);
        const second = Number(secondText);
        if (!Number.isFinite(first) || !Number.isFinite(second)) {
          output.textContent = "Enter valid numbers.";
          output.classList.add("error");
          return;
        }
        if (operation === "divide" && second === 0) {
          output.textContent = "Cannot divide by zero.";
          output.classList.add("error");
          return;
        }

        const calculations = {
          add: () => first + second,
          subtract: () => first - second,
          multiply: () => first * second,
          divide: () => first / second
        };
        const answer = calculations[operation]();
        output.textContent = Number.isFinite(answer) ? String(Number(answer.toPrecision(12))) : String(answer);
      });
    </script>
  </body>
</html>
